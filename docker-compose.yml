version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tibbinav_hrm
      POSTGRES_USER: tibbinav
      POSTGRES_PASSWORD: CHANGE_ME
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/src/TibbiNav.Api/Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=tibbinav_hrm;Username=tibbinav;Password=CHANGE_ME"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
    ports:
      - "3000:3000"

volumes:
  pgdata:
